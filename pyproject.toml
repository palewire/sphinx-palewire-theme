[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-palewire-theme"
dynamic = ["version"]
authors = [
  { name="Ben Welsh", email="b@palewi.re" },
]
description = "A Sphinx theme for sites hosted at palewi.re"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Sphinx",
    "click>=8",
    'exceptiongroup; python_version<"3.11"',
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.entry-points."sphinx.html_themes"]
palewire = "palewire"

[project.scripts]
sphinx-palewire-theme = "palewire.cli:main"

[project.urls]
Homepage = "https://github.com/palewire/sphinx-palewire-theme/"
Issues = "https://github.com/palewire/sphinx-palewire-theme/issues"

[tool.setuptools]
packages = ["palewire"]
include-package-data = false
zip-safe = false

[tool.setuptools.package-data]
palewire = ["*.html", "*.conf", "static/*.css", "static/*.css_t"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "myst-parser",
    "pre-commit",
    "ruff",
    "sphinx-autobuild",
    "ty",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
