name: Quality and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version at the selected tag to PyPI
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --locked ty check

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} python -m unittest discover -s tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --locked sphinx-build -W -b html docs docs/_build/html

  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docs]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - run: |
          uv venv --python 3.11 /tmp/package-test
          uv pip install --python /tmp/package-test/bin/python dist/*.whl
          mkdir /tmp/package-test-docs
          printf 'html_theme = "palewire"\n' > /tmp/package-test-docs/conf.py
          printf 'Package test\n============\n' > /tmp/package-test-docs/index.rst
          /tmp/package-test/bin/sphinx-build -W -b html /tmp/package-test-docs /tmp/package-test-docs/_build
          test -f /tmp/package-test-docs/_build/_static/palewire.css
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate
          path: ./dist
          if-no-files-found: error

  release:
    name: PyPI release
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: ./dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
